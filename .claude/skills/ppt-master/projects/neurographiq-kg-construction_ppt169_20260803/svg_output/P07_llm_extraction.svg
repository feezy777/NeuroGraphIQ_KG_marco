<rect x="40" y="120" width="4" height="48" fill="#58A6FF" /><text x="60" y="155" font-family="Microsoft YaHei" font-weight="bold" font-size="40" fill="#FFFFFF">LLM 知识提取：双模型驱动的知识关系构建</text>
<text x="40" y="200" font-family="Microsoft YaHei" font-size="18" fill="#8B949E">双 LLM 架构: DeepSeek (v4-pro / V3 / R1) + Kimi (Moonshot) · Provider 抽象层 · API Key 前端不可见</text>
