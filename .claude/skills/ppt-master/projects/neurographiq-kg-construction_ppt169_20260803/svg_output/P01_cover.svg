      <circle cx="950" cy="200" r="3" fill="#58A6FF" stroke="none"/>
      <circle cx="1080" cy="130" r="2" fill="#58A6FF" stroke="none"/>
      <circle cx="150" cy="500" r="2" fill="#79C0FF" stroke="none"/>
      <circle cx="300" cy="580" r="3" fill="#79C0FF" stroke="none"/>
      <circle cx="600" cy="620" r="2" fill="#79C0FF" stroke="none"/>
      <circle cx="900" cy="550" r="3" fill="#79C0FF" stroke="none"/>
      <circle cx="1050" cy="600" r="2" fill="#79C0FF" stroke="none"/>
      <circle cx="1150" cy="480" r="3" fill="#79C0FF" stroke="none"/>
      <line x1="200" y1="150" x2="350" y2="100" stroke="#58A6FF" stroke-width="0.8"/>
      <line x1="200" y1="150" x2="500" y2="180" stroke="#58A6FF" stroke-width="0.8"/>
      <line x1="350" y1="100" x2="500" y2="180" stroke="#58A6FF" stroke-width="0.8"/>
      <line x1="500" y1="180" x2="780" y2="120" stroke="#58A6FF" stroke-width="0.8"/>
      <line x1="780" y1="120" x2="950" y2="200" stroke="#58A6FF" stroke-width="0.8"/>
      <line x1="950" y1="200" x2="1080" y2="130" stroke="#58A6FF" stroke-width="0.8"/>
