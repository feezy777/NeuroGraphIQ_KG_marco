    <line x1="540" y1="240" x2="740" y2="240" stroke="#58A6FF" stroke-width="1.5" opacity="0.7"/>
    <text x="640" y="310" text-anchor="middle" font-family="Microsoft YaHei" font-weight="bold" font-size="68" fill="#FFFFFF" filter="url(#glowStrong)">NeuroGraphIQ KG V3</text>
