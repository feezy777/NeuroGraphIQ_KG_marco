  <path fill="#EDF2F7" d="M700,362 H1184 A8,8 0 0 1 1192,370 V406 A8,8 0 0 1 1184,414 H700 A8,8 0 0 1 692,406 V370 A8,8 0 0 1 700,362 Z" /><text x="716" y="394" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#243447">跨粒度只允许显式 mapping</text>
  <path fill="#EDF2F7" d="M700,432 H1184 A8,8 0 0 1 1192,440 V476 A8,8 0 0 1 1184,484 H700 A8,8 0 0 1 692,476 V440 A8,8 0 0 1 700,432 Z" /><text x="716" y="464" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#243447">Mirror 是唯一预正式缓冲层</text>
  </g>
  <g id="footer"><text x="1224" y="696" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#8492A0">2</text></g>
