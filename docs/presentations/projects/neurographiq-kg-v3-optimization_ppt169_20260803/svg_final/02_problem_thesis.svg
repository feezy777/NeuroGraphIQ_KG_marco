  <text x="740" y="192" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#17324D">核心命题与硬边界</text>
  <path fill="#EDF2F7" d="M700,222 H1184 A8,8 0 0 1 1192,230 V266 A8,8 0 0 1 1184,274 H700 A8,8 0 0 1 692,266 V230 A8,8 0 0 1 700,222 Z" /><text x="716" y="254" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#243447">LLM 不写 final_*</text>
