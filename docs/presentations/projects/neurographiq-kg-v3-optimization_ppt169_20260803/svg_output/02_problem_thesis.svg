<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="background"><rect width="1280" height="720" fill="#F7FAFC"/></g>
  <g id="header">
  <rect x="56" y="42" width="8" height="40" fill="#1F9FB5"/>
  <text x="80" y="72" font-family="Microsoft YaHei, Arial, sans-serif" font-size="34" font-weight="700" fill="#17324D">多源脑图谱知识为何难以可信沉淀</text>
  <text x="80" y="104" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#5A6A7A">问题先于方案：接入、合并、幻觉与追责</text>
  </g>
  <g id="left"><rect x="56" y="140" width="560" height="500" rx="10" fill="#FFFFFF" stroke="#CBD5E0"/>
  <use data-icon="tabler-outline/alert-triangle" x="84" y="168" width="32" height="32" stroke="#C05640" fill="none" stroke-width="2"/>
  <text x="132" y="192" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#17324D">核心问题</text>
  <circle cx="100" cy="244" r="14" fill="#EDF2F7" stroke="#C05640"/><text x="100" y="249" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#C05640">1</text><text x="132" y="250" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#243447">多源脑图谱难统一接入</text>
  <circle cx="100" cy="314" r="14" fill="#EDF2F7" stroke="#C05640"/><text x="100" y="319" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#C05640">2</text><text x="132" y="320" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#243447">跨粒度命名冲突易诱发隐式合并</text>
  <circle cx="100" cy="384" r="14" fill="#EDF2F7" stroke="#C05640"/><text x="100" y="389" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#C05640">3</text><text x="132" y="390" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#243447">LLM 可能带来幻觉与不稳定输出</text>
  <circle cx="100" cy="454" r="14" fill="#EDF2F7" stroke="#C05640"/><text x="100" y="459" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#C05640">4</text><text x="132" y="460" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#243447">审核若成黑盒则无法追责</text>
  </g>
  <g id="right"><rect x="664" y="140" width="560" height="500" rx="10" fill="#FFFFFF" stroke="#CBD5E0"/>
  <use data-icon="tabler-outline/lock" x="692" y="168" width="32" height="32" stroke="#2F855A" fill="none" stroke-width="2"/>
  <text x="740" y="192" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#17324D">核心命题与硬边界</text>
  <rect x="692" y="222" width="500" height="52" rx="8" fill="#EDF2F7"/><text x="716" y="254" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#243447">LLM 不写 final_*</text>
  <rect x="692" y="292" width="500" height="52" rx="8" fill="#EDF2F7"/><text x="716" y="324" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#243447">Final 只收经审核知识</text>
  <rect x="692" y="362" width="500" height="52" rx="8" fill="#EDF2F7"/><text x="716" y="394" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#243447">跨粒度只允许显式 mapping</text>
  <rect x="692" y="432" width="500" height="52" rx="8" fill="#EDF2F7"/><text x="716" y="464" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#243447">Mirror 是唯一预正式缓冲层</text>
  </g>
  <g id="footer"><text x="1224" y="696" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#8492A0">2</text></g>
</svg>
