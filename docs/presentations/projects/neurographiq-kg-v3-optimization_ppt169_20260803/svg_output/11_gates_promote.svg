  </g>
  <g id="promo"><text x="56" y="420" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#17324D">晋升三步骤</text>
  <rect x="56" y="450" width="280" height="90" rx="10" fill="#FFFFFF" stroke="#CBD5E0"/><text x="80" y="505" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1F9FB5">01</text><text x="126" y="505" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#243447">预览变更</text>
  <rect x="366" y="450" width="280" height="90" rx="10" fill="#FFFFFF" stroke="#CBD5E0"/><text x="390" y="505" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1F9FB5">02</text><text x="436" y="505" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#243447">人工确认</text>
  <rect x="676" y="450" width="280" height="90" rx="10" fill="#FFFFFF" stroke="#CBD5E0"/><text x="700" y="505" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1F9FB5">03</text><text x="746" y="505" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#243447">系统执行</text>
