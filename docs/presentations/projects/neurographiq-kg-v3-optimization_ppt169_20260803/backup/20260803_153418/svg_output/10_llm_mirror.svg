  <text x="84" y="260" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#243447">- Provider 抽象</text>
  <text x="84" y="320" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#243447">- 七类关系提取</text>
  <text x="84" y="380" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#243447">- 异步编排</text>
  <text x="84" y="440" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#243447">- 调用日志</text>
  </g>
  <g id="right"><rect x="664" y="140" width="560" height="480" rx="10" fill="#FFFFFF" stroke="#CBD5E0"/>
