<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="background"><rect width="1280" height="720" fill="#F7FAFC"/><image href="../images/llm_capability_backdrop.png" x="0" y="400" width="1280" height="320" preserveAspectRatio="xMidYMid slice"/><rect x="0" y="400" width="1280" height="320" fill="#F7FAFC"/></g>
  <g id="header">
