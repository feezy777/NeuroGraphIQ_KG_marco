  <g id="solution"><path fill="#1A365D" d="M64,486 H1216 A8,8 0 0 1 1224,494 V616 A8,8 0 0 1 1216,624 H64 A8,8 0 0 1 56,616 V494 A8,8 0 0 1 64,486 Z" /><text x="88" y="527" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">解决方案：分层漏斗治理</text><text x="88" y="570" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">候选 → 规则校验 → LLM 提取 → Mirror KG → Human Review → Final KG</text><text x="88" y="602" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#CBD5DF">自动化负责规模，治理边界负责可信，人工终审负责知识责任。</text></g>
