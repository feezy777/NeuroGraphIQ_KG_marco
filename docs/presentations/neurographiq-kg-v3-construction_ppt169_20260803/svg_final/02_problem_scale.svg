  <g id="background"><rect width="1280" height="720" fill="#FFFFFF" /></g>
  <g id="header"><rect x="56" y="42" width="8" height="40" fill="#3182CE" /><text x="84" y="72" font-family="Cambria, SimSun, serif" font-size="34" font-weight="700" fill="#1A365D">分散资源、粒度断裂与 LLM 风险共同阻碍脑区知识整合</text><text x="84" y="104" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5F6F7F">问题不是“能否提取”，而是“如何让提取结果可治理、可审核、可追溯”</text></g>
  <g id="problem-strip"><path fill="#F4F7FA" d="M64,132 H1216 A8,8 0 0 1 1224,140 V218 A8,8 0 0 1 1216,226 H64 A8,8 0 0 1 56,218 V140 A8,8 0 0 1 64,132 Z" /><text x="84" y="172" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A365D">三重挑战</text><text x="84" y="205" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#243447">6+ 异构资源</text><text x="430" y="205" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#243447">跨粒度关系断裂</text><text x="820" y="205" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#243447">LLM 错误可能沿链传播</text></g>
