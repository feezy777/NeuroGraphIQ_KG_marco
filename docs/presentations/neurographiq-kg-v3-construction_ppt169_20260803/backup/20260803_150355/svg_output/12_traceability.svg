<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="background"><rect width="1280" height="720" fill="#FFFFFF"/></g>
  <g id="header"><text x="56" y="70" font-family="Cambria, SimSun, serif" font-size="34" font-weight="700" fill="#1A365D">每个 Final KG 事实都能沿七步链路回到原始脑图谱资源</text><text x="56" y="102" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5F6F7F">消费能力建立在可解释、可追责的数据血缘之上</text></g>
  <g id="consumption">
    <rect x="56" y="132" width="1168" height="104" rx="8" fill="#F4F7FA"/>
    <text x="82" y="172" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A365D">知识消费</text>
    <text x="240" y="172" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#243447">图谱探索</text><text x="430" y="172" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#243447">症状查询</text><text x="620" y="172" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#243447">四阶段数据中心</text><text x="860" y="172" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#243447">JSONL / CSV / Neo4j 导出</text>
    <text x="82" y="210" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5F6F7F">所有入口使用同一 Final KG 查询面</text>
  </g>
  <g id="snake-track">
    <path d="M160 330 H1080 A70 70 0 0 1 1080 470 H160 A70 70 0 0 0 160 610 H1080" fill="none" stroke="#F4F7FA" stroke-width="30" stroke-linecap="round"/>
    <path d="M160 330 H1080 A70 70 0 0 1 1080 470 H160 A70 70 0 0 0 160 610 H1080" fill="none" stroke="#3182CE" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g id="trace-1"><circle cx="160" cy="330" r="30" fill="#1A365D"/><text x="160" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">1</text><text x="160" y="286" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#243447">Final fact</text></g>
  <g id="trace-2"><circle cx="455" cy="330" r="30" fill="#3182CE"/><text x="455" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">2</text><text x="455" y="286" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#243447">Promotion</text></g>
  <g id="trace-3"><circle cx="750" cy="330" r="30" fill="#3182CE"/><text x="750" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">3</text><text x="750" y="286" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#243447">Review</text></g>
  <g id="trace-4"><circle cx="1060" cy="350" r="30" fill="#DD6B20"/><text x="1060" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">4</text><text x="1110" y="355" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#243447">Validation</text></g>
  <g id="trace-5"><circle cx="820" cy="470" r="30" fill="#DD6B20"/><text x="820" y="478" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">5</text><text x="820" y="524" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#243447">Extraction item</text></g>
  <g id="trace-6"><circle cx="480" cy="470" r="30" fill="#3182CE"/><text x="480" y="478" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">6</text><text x="480" y="524" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#243447">Run / Candidate</text></g>
  <g id="trace-7"><circle cx="210" cy="610" r="30" fill="#38A169"/><text x="210" y="618" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">7</text><text x="210" y="662" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#243447">Import / Resource</text></g>
  <g id="audit-data"><rect x="570" y="570" width="590" height="80" rx="8" fill="#1A365D"/><text x="600" y="604" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">保留：原始响应 · 模型 · Prompt · 批次 · 资源标识</text><text x="600" y="634" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#CBD5DF">溯源不是日志附属品，而是每个知识事实的组成部分。</text></g>
  <g id="footer"><text x="1224" y="704" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#8492A0">12</text></g>
</svg>
