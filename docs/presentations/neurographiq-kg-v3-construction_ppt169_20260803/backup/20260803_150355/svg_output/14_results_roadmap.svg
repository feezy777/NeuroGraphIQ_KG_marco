  <g id="footer"><text x="56" y="690" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#8492A0">Source: implementation inventory and roadmap</text><text x="1224" y="690" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#8492A0">14</text></g>
