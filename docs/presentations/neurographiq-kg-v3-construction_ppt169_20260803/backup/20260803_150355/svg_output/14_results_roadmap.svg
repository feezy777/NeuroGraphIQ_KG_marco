    <text x="88" y="336" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#3182CE">治理与审核</text><text x="262" y="336" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#243447">双模型盲审 · 交叉验证 · 专家终审</text>
    <line x1="88" y1="366" x2="824" y2="366" stroke="#CBD5DF"/>
    <text x="88" y="414" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#3182CE">正式知识</text><text x="262" y="414" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#243447">Promotion · Final KG · 三元组整合</text>
    <line x1="88" y1="444" x2="824" y2="444" stroke="#CBD5DF"/>
    <text x="88" y="492" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#3182CE">工作台</text><text x="262" y="492" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#243447">14 页前端 · 42 路由 · 88 服务</text>
