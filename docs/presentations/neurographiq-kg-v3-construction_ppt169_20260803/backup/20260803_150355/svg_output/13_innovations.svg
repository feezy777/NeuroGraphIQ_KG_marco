<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="background"><rect width="1280" height="720" fill="#FFFFFF"/></g>
  <g id="header"><text x="56" y="70" font-family="Cambria, SimSun, serif" font-size="34" font-weight="700" fill="#1A365D">六项创新共同把 LLM 从“知识裁判”降级为“受控提取工具”</text><text x="56" y="102" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5F6F7F">可信来自系统治理，而不是单一模型能力</text></g>
  <g id="track"><line x1="156" y1="144" x2="156" y2="636" stroke="#3182CE" stroke-width="4"/></g>
  <g id="item-1"><circle cx="156" cy="170" r="24" fill="#1A365D"/><text x="156" y="177" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">1</text><text x="206" y="168" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#1A365D">分层漏斗治理</text><text x="206" y="196" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#5F6F7F">候选、校验、提取、Mirror、审核、Final 各司其职</text></g>
  <g id="item-2"><circle cx="156" cy="260" r="24" fill="#3182CE"/><text x="156" y="267" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">2</text><text x="206" y="258" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#1A365D">Mirror KG 与 Canonical Key</text><text x="206" y="286" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#5F6F7F">把自动化高吞吐与正式知识安全隔离</text></g>
  <g id="item-3"><circle cx="156" cy="350" r="24" fill="#DD6B20"/><text x="156" y="357" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">3</text><text x="206" y="348" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#1A365D">双模型盲审</text><text x="206" y="376" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#5F6F7F">共识加速、冲突升级，避免单模型自证</text></g>
  <g id="item-4"><circle cx="156" cy="440" r="24" fill="#3182CE"/><text x="156" y="447" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">4</text><text x="206" y="438" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#1A365D">Tier 1 + Tier 2 增强</text><text x="206" y="466" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#5F6F7F">确定性修复与 LLM 建议分离，建议必须经人工采纳</text></g>
  <g id="item-5"><circle cx="156" cy="530" r="24" fill="#38A169"/><text x="156" y="537" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">5</text><text x="206" y="528" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#1A365D">七步全链路溯源</text><text x="206" y="556" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#5F6F7F">每个正式事实都可回到模型响应、候选与原始资源</text></g>
  <g id="item-6"><circle cx="156" cy="620" r="24" fill="#1A365D"/><text x="156" y="627" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">6</text><text x="206" y="618" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#1A365D">五层粒度隔离与显式映射</text><text x="206" y="646" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#5F6F7F">Schema 防止语义串扰，Mapping 承担跨粒度责任</text></g>
  <g id="thesis"><rect x="890" y="180" width="334" height="350" rx="8" fill="#1A365D"/><text x="1057" y="244" text-anchor="middle" font-family="Cambria, SimSun, serif" font-size="40" font-weight="700" fill="#FFFFFF">可信知识</text><text x="1057" y="304" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#CBD5DF">不是模型一次答对</text><line x1="944" y1="344" x2="1170" y2="344" stroke="#3182CE" stroke-width="3"/><text x="1057" y="400" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#FFFFFF">而是错误可发现</text><text x="1057" y="444" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#FFFFFF">决策可追责</text><text x="1057" y="488" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#FFFFFF">结果可回溯</text></g>
  <g id="footer"><text x="1224" y="704" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#8492A0">13</text></g>
</svg>
