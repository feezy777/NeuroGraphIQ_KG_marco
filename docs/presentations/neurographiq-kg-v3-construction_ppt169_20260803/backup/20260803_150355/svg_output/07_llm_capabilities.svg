<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="background"><rect width="1280" height="720" fill="#FFFFFF"/></g>
  <g id="header"><text x="56" y="70" font-family="Cambria, SimSun, serif" font-size="34" font-weight="700" fill="#1A365D">Provider 抽象层统一双 LLM，七类能力均受粒度边界约束</text><text x="56" y="102" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5F6F7F">DeepSeek 与 Kimi 共享接口，但不共享未经审核的结论</text></g>
  <g id="framework-image"><image href="../images/llm_capability_backdrop.png" x="140" y="130" width="870" height="540" preserveAspectRatio="xMidYMid meet"/></g>
  <g id="labels">
    <rect x="510" y="130" width="220" height="34" rx="8" fill="#1A365D"/><text x="620" y="153" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">DeepSeek / Kimi Provider</text>
    <rect x="84" y="204" width="170" height="34" rx="8" fill="#FFFFFF" stroke="#3182CE"/><text x="169" y="227" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="700" fill="#1A365D">连接提取</text>
    <rect x="54" y="342" width="170" height="34" rx="8" fill="#FFFFFF" stroke="#3182CE"/><text x="139" y="365" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="700" fill="#1A365D">功能提取</text>
    <rect x="120" y="500" width="170" height="34" rx="8" fill="#FFFFFF" stroke="#3182CE"/><text x="205" y="523" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="700" fill="#1A365D">回路提取</text>
    <rect x="392" y="620" width="170" height="34" rx="8" fill="#FFFFFF" stroke="#3182CE"/><text x="477" y="643" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="700" fill="#1A365D">投射功能</text>
    <rect x="750" y="592" width="170" height="34" rx="8" fill="#FFFFFF" stroke="#3182CE"/><text x="835" y="615" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="700" fill="#1A365D">回路功能</text>
    <rect x="924" y="430" width="170" height="34" rx="8" fill="#FFFFFF" stroke="#3182CE"/><text x="1009" y="453" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="700" fill="#1A365D">回路步骤</text>
    <rect x="910" y="238" width="190" height="34" rx="8" fill="#38A169"/><text x="1005" y="261" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">三元组整合：确定性</text>
  </g>
  <g id="guardrails">
    <rect x="1060" y="150" width="164" height="470" rx="8" fill="#F4F7FA"/>
    <text x="1082" y="190" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A365D">四条护栏</text>
    <text x="1082" y="238" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#243447">同粒度内提取</text>
    <text x="1082" y="286" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#243447">显式 Mapping</text>
    <text x="1082" y="334" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#243447">API Key 后端化</text>
    <text x="1082" y="382" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#243447">Raw Response 留存</text>
    <line x1="1082" y1="422" x2="1200" y2="422" stroke="#CBD5DF"/>
    <text x="1082" y="466" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#DD6B20">模型输出是候选</text>
    <text x="1082" y="510" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#38A169">规则与审核定稿</text>
  </g>
  <g id="footer"><text x="56" y="690" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#8492A0">Seven extraction capabilities share one controlled provider boundary.</text><text x="1224" y="690" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#8492A0">07</text></g>
</svg>
