<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="background"><rect width="1280" height="720" fill="#FFFFFF"/></g>
  <g id="header">
    <text x="56" y="68" font-family="Cambria, SimSun, serif" font-size="34" font-weight="700" fill="#1A365D">全局架构以 Mirror KG 为安全中转，隔离自动提取与正式知识</text>
    <text x="56" y="100" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5F6F7F">六阶段治理漏斗 · 唯一正式写入口 · 全链路审计</text>
  </g>
  <g id="architecture-image">
    <rect x="56" y="132" width="872" height="500" rx="8" fill="#F4F7FA" stroke="#CBD5DF"/>
    <image href="../images/global_architecture_atmosphere.png" x="64" y="140" width="856" height="484" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <g id="stage-labels">
    <rect x="70" y="154" width="118" height="28" rx="8" fill="#1A365D"/><text x="129" y="174" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">资源登记</text>
    <rect x="205" y="154" width="118" height="28" rx="8" fill="#3182CE"/><text x="264" y="174" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">批次导入</text>
    <rect x="340" y="154" width="118" height="28" rx="8" fill="#3182CE"/><text x="399" y="174" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">候选校验</text>
    <rect x="475" y="154" width="118" height="28" rx="8" fill="#DD6B20"/><text x="534" y="174" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">LLM 提取</text>
    <rect x="610" y="154" width="118" height="28" rx="8" fill="#1A365D"/><text x="669" y="174" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Mirror 治理</text>
    <rect x="745" y="154" width="118" height="28" rx="8" fill="#38A169"/><text x="804" y="174" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">审核晋升</text>
  </g>
  <g id="write-boundary">
    <rect x="956" y="132" width="268" height="234" rx="8" fill="#1A365D"/>
    <text x="982" y="172" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">写入边界</text>
    <text x="982" y="214" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#FFFFFF">LLM 不得直接写 Final</text>
    <text x="982" y="250" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#FFFFFF">不得自动审核或晋升</text>
    <line x1="982" y1="278" x2="1198" y2="278" stroke="#CBD5DF"/>
    <text x="982" y="318" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#38A169">Promotion 是唯一入口</text>
  </g>
  <g id="outputs">
    <rect x="956" y="392" width="268" height="240" rx="8" fill="#F4F7FA" stroke="#CBD5DF"/>
    <text x="982" y="432" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A365D">Final KG 消费端</text>
    <text x="982" y="474" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#243447">图谱探索</text>
    <text x="982" y="510" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#243447">症状查询</text>
    <text x="982" y="546" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#243447">数据中心</text>
    <text x="982" y="582" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#243447">离线导出</text>
  </g>
  <g id="footer"><text x="56" y="690" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#8492A0">Architecture semantics are editable SVG overlays.</text><text x="1224" y="690" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#8492A0">04</text></g>
</svg>
