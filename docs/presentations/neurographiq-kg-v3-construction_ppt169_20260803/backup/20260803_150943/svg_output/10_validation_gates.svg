<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="background"><rect width="1280" height="720" fill="#FFFFFF"/></g>
  <g id="header"><text x="56" y="70" font-family="Cambria, SimSun, serif" font-size="34" font-weight="700" fill="#1A365D">三道闸门缺一不可：规则提效、模型复核、专家终审</text><text x="56" y="102" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5F6F7F">任何单点通过都不能替代完整治理链</text></g>
  <g id="gate-image"><image href="../images/validation_gates_backdrop.png" x="56" y="136" width="800" height="534" preserveAspectRatio="xMidYMid meet"/></g>
  <g id="chevrons">
    <polygon points="80,160 270,160 306,205 270,250 80,250" fill="#1A365D"/><text x="185" y="198" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">闸门 1 · 规则</text><text x="185" y="224" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#FFFFFF">12 条确定性校验</text>
    <polygon points="312,160 516,160 552,205 516,250 312,250 348,205" fill="#3182CE"/><text x="432" y="198" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">闸门 2 · 模型</text><text x="432" y="224" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#FFFFFF">双模型盲审</text>
    <polygon points="558,160 776,160 812,205 776,250 558,250 594,205" fill="#38A169"/><text x="685" y="198" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">闸门 3 · 专家</text><text x="685" y="224" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#FFFFFF">人工终审</text>
  </g>
  <g id="details">
    <rect x="888" y="140" width="336" height="150" rx="8" fill="#F4F7FA"/><text x="916" y="180" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#1A365D">规则闸门</text><text x="916" y="220" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#243447">Blocker：修复后重试</text><text x="916" y="256" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#243447">Warning：带标记继续</text>
    <rect x="888" y="312" width="336" height="150" rx="8" fill="#F4F7FA"/><text x="916" y="352" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#3182CE">模型闸门</text><text x="916" y="392" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#243447">consensus：绿色通道</text><text x="916" y="428" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#243447">conflict：升级处理</text>
    <rect x="888" y="484" width="336" height="150" rx="8" fill="#1A365D"/><text x="916" y="524" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">专家闸门</text><text x="916" y="564" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#FFFFFF">approve / reject</text><text x="916" y="600" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#FFFFFF">request_changes</text>
  </g>
  <g id="footer"><text x="56" y="700" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#8492A0">All three gates must pass before promotion.</text><text x="1224" y="700" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#8492A0">10</text></g>
</svg>
