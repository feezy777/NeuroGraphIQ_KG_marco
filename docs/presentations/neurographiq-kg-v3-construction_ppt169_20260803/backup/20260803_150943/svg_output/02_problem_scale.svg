<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="background"><rect width="1280" height="720" fill="#FFFFFF"/></g>
  <g id="header"><rect x="56" y="42" width="8" height="40" fill="#3182CE"/><text x="84" y="72" font-family="Cambria, SimSun, serif" font-size="34" font-weight="700" fill="#1A365D">分散资源、粒度断裂与 LLM 风险共同阻碍脑区知识整合</text><text x="84" y="104" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5F6F7F">问题不是“能否提取”，而是“如何让提取结果可治理、可审核、可追溯”</text></g>
  <g id="problem-strip"><rect x="56" y="132" width="1168" height="94" rx="8" fill="#F4F7FA"/><text x="84" y="172" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A365D">三重挑战</text><text x="84" y="205" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#243447">6+ 异构资源</text><text x="430" y="205" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#243447">跨粒度关系断裂</text><text x="820" y="205" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#243447">LLM 错误可能沿链传播</text></g>
  <g id="kpi-1"><rect x="56" y="258" width="272" height="190" rx="8" fill="#FFFFFF" stroke="#CBD5DF"/><rect x="56" y="258" width="272" height="6" fill="#1A365D"/><text x="82" y="304" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5F6F7F">后端能力</text><text x="82" y="360" font-family="Cambria, SimSun, serif" font-size="40" font-weight="700" fill="#1A365D">42 / 88</text><text x="82" y="397" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#243447">路由 / 服务</text></g>
  <g id="kpi-2"><rect x="354" y="258" width="272" height="190" rx="8" fill="#FFFFFF" stroke="#CBD5DF"/><rect x="354" y="258" width="272" height="6" fill="#3182CE"/><text x="380" y="304" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5F6F7F">前端工作台</text><text x="380" y="360" font-family="Cambria, SimSun, serif" font-size="40" font-weight="700" fill="#3182CE">14</text><text x="380" y="397" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#243447">React 页面</text></g>
  <g id="kpi-3"><rect x="652" y="258" width="272" height="190" rx="8" fill="#FFFFFF" stroke="#CBD5DF"/><rect x="652" y="258" width="272" height="6" fill="#DD6B20"/><text x="678" y="304" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5F6F7F">数据层</text><text x="678" y="360" font-family="Cambria, SimSun, serif" font-size="40" font-weight="700" fill="#DD6B20">5 / 59</text><text x="678" y="397" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#243447">Schema / 迁移</text></g>
  <g id="kpi-4"><rect x="950" y="258" width="274" height="190" rx="8" fill="#FFFFFF" stroke="#CBD5DF"/><rect x="950" y="258" width="274" height="6" fill="#38A169"/><text x="976" y="304" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5F6F7F">测试保障</text><text x="976" y="360" font-family="Cambria, SimSun, serif" font-size="40" font-weight="700" fill="#38A169">1,173</text><text x="976" y="397" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#243447">测试函数</text></g>
  <g id="solution"><rect x="56" y="486" width="1168" height="138" rx="8" fill="#1A365D"/><text x="88" y="527" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">解决方案：分层漏斗治理</text><text x="88" y="570" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">候选 → 规则校验 → LLM 提取 → Mirror KG → Human Review → Final KG</text><text x="88" y="602" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#CBD5DF">自动化负责规模，治理边界负责可信，人工终审负责知识责任。</text></g>
  <g id="footer"><text x="56" y="690" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#8492A0">Source: NeuroGraphIQ KG V3 project inventory</text><text x="1224" y="690" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#8492A0">02</text></g>
</svg>
